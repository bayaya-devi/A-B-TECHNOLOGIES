<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Créer votre mot de passe — A&amp;B Technologies</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fafbfc;color:#1a2333;font:15px/1.55 Inter,sans-serif}.card{width:min(440px,100%);background:#fff;border:1px solid #d8dee6;border-radius:16px;padding:30px;box-shadow:0 18px 55px #1022410d}h1{font:800 28px/1.2 Manrope,sans-serif;margin:0 0 10px}p{color:#657184}label{display:block;font-weight:700;margin:20px 0 6px}input{width:100%;padding:12px;border:1px solid #d8dee6;border-radius:9px;font:inherit}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#0a1730;color:#fff;font:700 14px Inter;cursor:pointer}.message{min-height:24px;margin-top:14px;color:#b42318}.hidden{display:none}</style>
</head>
<body><main class="card"><div id="loading"><h1>Validation du lien…</h1><p>Nous sécurisons votre accès administrateur.</p></div><form id="passwordForm" class="hidden"><h1>Choisissez votre mot de passe</h1><p>Il protégera l’administration A&amp;B Technologies.</p><label for="password">Nouveau mot de passe</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirmPassword">Confirmer le mot de passe</label><input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required><button type="submit">Activer mon accès administrateur</button><p id="message" class="message" role="alert"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(()=>{'use strict';const c=window.AB_SUPABASE_CONFIG,s=window.supabase.createClient(c.url,c.anonKey),form=document.querySelector('#passwordForm'),loading=document.querySelector('#loading'),message=document.querySelector('#message');async function ready(){const{data:{session}}=await s.auth.getSession();if(session){loading.classList.add('hidden');form.classList.remove('hidden');return}setTimeout(async()=>{const{data:{session:late}}=await s.auth.getSession();if(late){loading.classList.add('hidden');form.classList.remove('hidden')}else{loading.innerHTML='<h1>Lien invalide ou expiré</h1><p>Demandez un nouvel email d’activation.</p>'}},1200)}s.auth.onAuthStateChange((_event,session)=>{if(session){loading.classList.add('hidden');form.classList.remove('hidden')}});form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';const password=document.querySelector('#password').value,confirmation=document.querySelector('#confirmPassword').value;if(password!==confirmation){message.textContent='Les deux mots de passe ne correspondent pas.';return}const button=form.querySelector('button');button.disabled=true;button.textContent='Activation…';const{error}=await s.auth.updateUser({password});if(error){message.textContent=error.message;button.disabled=false;button.textContent='Activer mon accès administrateur';return}location.href='admin.html'});ready()})();</script></body></html>
