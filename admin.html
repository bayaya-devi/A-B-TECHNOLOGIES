<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — A&amp;B Technologies</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#0a1730;--line:#d8dee6;--muted:#657184;--soft:#eef1f5}*{box-sizing:border-box}body{margin:0;background:#fafbfc;color:#1a2333;font:14px/1.5 Inter,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px max(22px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font:800 15px Manrope;letter-spacing:.08em;color:var(--navy)}main{max-width:1200px;margin:42px auto;padding:0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}.hidden{display:none!important}input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}button{border:0;border-radius:8px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.login{max-width:420px;margin:70px auto}.login label{display:block;margin:15px 0 5px;font-weight:700}.error{color:#b42318;margin:12px 0}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input{max-width:420px}.grid{display:grid;grid-template-columns:380px 1fr;gap:18px}.list{padding:0;overflow:hidden}.request{display:block;width:100%;text-align:left;background:#fff;color:inherit;border-radius:0;border-bottom:1px solid var(--line)}.request:hover,.request.active{background:var(--soft)}.request small{display:block;color:var(--muted)}.detail h2{font:700 24px Manrope;margin:0}.meta{color:var(--muted)}.block{margin:22px 0}.block h3{font:700 15px Manrope;margin:0 0 7px}.answer{white-space:pre-wrap;background:var(--soft);padding:13px;border-radius:8px}.row{display:grid;grid-template-columns:1fr 170px;gap:10px}.docs a{display:block;color:#17345e;margin:6px 0}@media(max-width:760px){main{margin-top:24px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><header><div class="brand">A&amp;B TECHNOLOGIES · ADMINISTRATION</div><button id="logout" class="hidden">Déconnexion</button></header><main><section id="loginBox" class="card login"><h1>Accès sécurisé</h1><p>Connectez-vous avec votre compte administrateur A&amp;B.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><p id="loginError" class="error"></p><button id="login">Connexion</button></section><section id="app" class="hidden"><h1>Demandes projets</h1><div class="toolbar"><input id="search" placeholder="Rechercher par référence, nom ou entreprise"><button id="refresh">Actualiser</button></div><p id="appError" class="error"></p><div class="grid"><div id="list" class="card list"></div><article id="detail" class="card detail"><p class="meta">Sélectionnez une demande pour la consulter.</p></article></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(()=>{'use strict';const c=window.AB_SUPABASE_CONFIG||{},s=c.url&&c.anonKey&&window.supabase?window.supabase.createClient(c.url,c.anonKey):null,$=x=>document.querySelector(x);let rows=[],selected=null;function error(m){$('#appError').textContent=m}async function auth(){if(!s){$('#loginError').textContent='Supabase n’est pas configuré.';return}const{data:{session}}=await s.auth.getSession();if(session){$('#loginBox').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');load()} }async function load(){error('');const{data,error:e}=await s.from('project_requests').select('id,reference,status,first_name,last_name,company_name,email,phone,whatsapp,request_types,summary,answers,submitted_at,internal_notes').order('submitted_at',{ascending:false});if(e){error('Accès refusé ou indisponible : '+e.message);return}rows=data||[];renderList()}function renderList(){const q=$('#search').value.toLowerCase();const filtered=rows.filter(r=>[r.reference,r.first_name,r.last_name,r.company_name].join(' ').toLowerCase().includes(q));$('#list').innerHTML=filtered.length?filtered.map(r=>`<button class="request ${r.id===selected?.id?'active':''}" data-id="${r.id}"><b>${r.reference}</b><small>${r.first_name} ${r.last_name}${r.company_name?' · '+r.company_name:''}</small><small>${new Date(r.submitted_at).toLocaleString('fr-FR')} · ${r.status}</small></button>`).join(''):'<p class="meta" style="padding:16px">Aucune demande.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(rows.find(r=>r.id===b.dataset.id)))}async function show(r){selected=r;renderList();const a=r.answers||{};const{data:docs,error:e}=await s.from('request_documents').select('*').eq('request_id',r.id);let docHtml='Aucun document.';if(!e&&docs?.length){const links=await Promise.all(docs.map(async d=>{const x=await s.storage.from('project-documents').createSignedUrl(d.storage_path,60);return x.data?`<a target="_blank" rel="noopener" href="${x.data.signedUrl}">${d.original_name}</a>`:d.original_name;}));docHtml=links.join('')}$('#detail').innerHTML=`<div class="row"><div><h2>${r.reference}</h2><p class="meta">${r.first_name} ${r.last_name} · ${r.email}${r.phone?' · '+r.phone:''}</p></div><select id="status">${['new','qualified','contacted','meeting','proposal','won','lost','archived'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="block"><h3>Demande</h3><p>${(r.request_types||[]).join(', ')||'—'}</p></div><div class="block"><h3>Vision</h3><div class="answer">${a.vision||'—'}</div></div><div class="block"><h3>Réponses complètes</h3><div class="answer">${Object.entries(a).filter(([,v])=>v&&(!Array.isArray(v)||v.length)).map(([k,v])=>`${k} : ${typeof v==='object'?JSON.stringify(v):v}`).join('\n\n')||'—'}</div></div><div class="block docs"><h3>Documents privés</h3>${docHtml}</div><div class="block"><h3>Notes internes</h3><textarea id="notes">${r.internal_notes||''}</textarea><button id="save" style="margin-top:9px">Enregistrer les modifications</button></div>`;$('#save').onclick=async()=>{const{error:e}=await s.from('project_requests').update({status:$('#status').value,internal_notes:$('#notes').value}).eq('id',r.id);if(e){error(e.message);return}r.status=$('#status').value;r.internal_notes=$('#notes').value;renderList();};}$('#login').onclick=async()=>{const{error:e}=await s.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(e)$('#loginError').textContent='Connexion impossible : '+e.message;else auth()};$('#logout').onclick=async()=>{await s.auth.signOut();location.reload()};$('#refresh').onclick=load;$('#search').oninput=renderList;auth()})();</script><script src="admin-password.js"></script></body></html>
